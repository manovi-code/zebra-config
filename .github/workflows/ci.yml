name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...

  mac-universal:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build a universal Mac binary
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o /tmp/zebra-config-intel ./cmd/zebra-config
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o /tmp/zebra-config-arm64 ./cmd/zebra-config
          lipo -create -output zebra-config-macos-universal /tmp/zebra-config-intel /tmp/zebra-config-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: zebra-config-macos-universal

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, mac-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/zebra-config-windows-amd64.exe ./cmd/zebra-config
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/zebra-config-macos-intel ./cmd/zebra-config
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/zebra-config-macos-apple-silicon ./cmd/zebra-config
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/zebra-config-linux-amd64 ./cmd/zebra-config
      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
